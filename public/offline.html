<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Equidy · Offline</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #000; color: #f4f4f4; text-align: center;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 24px 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 0; color: #9a9a9a; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 28px; padding: 12px 28px; border: 0; border-radius: 999px;
        background: #f4f4f4; color: #000; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #f4f4f4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon-192.png" alt="Equidy" />
      <h1>You're offline</h1>
      <p>Equidy needs a connection for live markets, your portfolio and chat. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener("online", () => location.reload());</script>
  </body>
</html>
